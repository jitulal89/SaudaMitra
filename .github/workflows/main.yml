
name: Build SaudaMitra Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "SaudaMitra.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    name: Unzip and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip SaudaMitra source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SaudaMitra.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          echo "Source ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/source"

          SETTINGS="$(find "$ROOT" -type f \
            \( -name settings.gradle \
               -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle file found in ZIP."
            find "$ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project located."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not configured on the runner."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No usable sdkmanager found in $SDK_ROOT."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses \
            >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated at the expected path."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/SaudaMitra-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/SaudaMitra-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaudaMitra-Android-APK
          path: apk-output/SaudaMitra-debug.apk
          if-no-files-found: error
          retention-days: 14
